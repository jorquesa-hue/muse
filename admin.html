<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src https: data:; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Muse — aprovar eventos</title>
<style>
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:Nunito;font-weight:400;src:url(fonts/nunito-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
  :root{--bg:#fff8ec;--ink:#1e1640;--mut:#4f4870;--dim:#6a6488;--line:rgba(30,22,64,.14);--acc:#ff3d7f;--ok:#0b7f72}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.45}
  main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin:0 0 4px}
  .sub{color:var(--mut);font-weight:800;margin:0 0 16px}
  .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
  .card.pending{border-color:var(--acc)}
  .card h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;margin:6px 0}
  .tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:#eee}
  .tag.pending{background:#ffe3ec;color:#c8155a}.tag.unconfirmed{background:#fff3d6}.tag.approved{background:#dff6f1;color:var(--ok)}.tag.rejected{background:#eee;color:#666}
  .meta{font-size:14px;color:var(--mut);margin:4px 0}
  .desc{margin:8px 0}
  .contact{font-size:13px;color:var(--dim);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
  .row{display:flex;gap:8px;margin-top:10px}
  button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;flex:1}
  .yes{background:var(--ok);color:#fff}.no{background:#eee;color:var(--ink)}
  img{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}
  a{color:#c8155a;word-break:break-all}
  input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin:8px 0}
</style>
</head>
<body>
<main>
  <h1>Eventos cadastrados</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div id="list"></div>
</main>
<script src="admin.js"></script>
</body>
</html>
