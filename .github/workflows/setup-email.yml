name: Set up e-mail (Resend)

# One-time setup for organizer confirmation e-mails (api/submit.mjs), and safe to re-run:
#   1. registers muse-find.com in Resend (or finds it),
#   2. writes Resend's DNS records (SPF/DKIM/bounce MX) into the domain's Vercel DNS,
#   3. asks Resend to verify the domain,
#   4. copies RESEND_API_KEY into the Vercel project's environment.
# Needs repo secrets RESEND_API_KEY and VERCEL_TOKEN. No value is ever printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Resend + Vercel DNS + Vercel env
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DOMAIN: muse-find.com
          PROJECT: prj_oI8NSLUV1yNzga7SjqBrp49If3Gz
          TEAM: team_zh337tXixhvsa4rinCndAoKc
        run: |
          cat > setup.mjs <<'EOF'
          const { RESEND_API_KEY, VERCEL_TOKEN, DOMAIN, PROJECT, TEAM } = process.env;
          if (!RESEND_API_KEY || !VERCEL_TOKEN) { console.error('missing RESEND_API_KEY or VERCEL_TOKEN secret'); process.exit(1); }
          const rs = async (path, opts = {}) => {
            const r = await fetch('https://api.resend.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + RESEND_API_KEY, 'Content-Type': 'application/json' } });
            const t = await r.text(); if (!r.ok) throw new Error(`Resend ${path} ${r.status}: ${t.slice(0, 300)}`); return t ? JSON.parse(t) : {};
          };
          const vc = async (path, opts = {}) => {
            const r = await fetch(`https://api.vercel.com${path}${path.includes('?') ? '&' : '?'}teamId=${TEAM}`, { ...opts, headers: { Authorization: 'Bearer ' + VERCEL_TOKEN, 'Content-Type': 'application/json' } });
            const t = await r.text(); return { ok: r.ok, status: r.status, body: t ? JSON.parse(t) : {} };
          };
          // 1. domain in Resend
          let dom = ((await rs('/domains')).data || []).find((d) => d.name === DOMAIN);
          if (!dom) dom = await rs('/domains', { method: 'POST', body: JSON.stringify({ name: DOMAIN, region: 'sa-east-1' }) });
          const full = await rs('/domains/' + dom.id);
          console.log(`Resend domain ${DOMAIN}: ${full.status}`);
          // 2. DNS records into Vercel (skip ones that already exist)
          const existing = (await vc(`/v4/domains/${DOMAIN}/records?limit=100`)).body.records || [];
          for (const rec of full.records || []) {
            const name = rec.name === DOMAIN ? '' : String(rec.name).replace(new RegExp('\\.?' + DOMAIN.replace('.', '\\.') + '$'), '');
            if (existing.some((e) => e.type === rec.type && e.name === name && String(e.value).replace(/\.$/, '') === String(rec.value).replace(/\.$/, ''))) { console.log(`DNS ${rec.type} ${name || '@'}: already there`); continue; }
            const body = { name, type: rec.type, value: rec.value, ttl: 3600 };
            if (rec.type === 'MX') body.mxPriority = Number(rec.priority || 10);
            const r = await vc(`/v2/domains/${DOMAIN}/records`, { method: 'POST', body: JSON.stringify(body) });
            console.log(`DNS ${rec.type} ${name || '@'}: ${r.ok ? 'created' : 'FAILED ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 200)}`);
          }
          // 3. verification (DNS can take a few minutes; re-run this workflow later if it is still pending)
          await rs(`/domains/${dom.id}/verify`, { method: 'POST' });
          console.log('Verification requested. Status now:', (await rs('/domains/' + dom.id)).status);
          // 4. key + sender into Vercel env
          for (const [key, value, type] of [['RESEND_API_KEY', RESEND_API_KEY, 'sensitive'], ['MAIL_FROM', `Muse <eventos@${DOMAIN}>`, 'plain']]) {
            const r = await vc(`/v10/projects/${PROJECT}/env?upsert=true`, { method: 'POST', body: JSON.stringify({ key, value, type, target: ['production', 'preview'] }) });
            console.log(`Vercel env ${key}: ${r.ok ? 'saved' : 'FAILED ' + r.status}`);
            if (!r.ok) process.exit(1);
          }
          EOF
          node setup.mjs
